name: Game tags

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validate-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Check every registered game is tagged
        run: python scripts/check_tags.py
      - name: Tag tests
        run: python -m pytest tests -q
